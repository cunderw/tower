query DockerContainers {
  docker {
    containers {
      ...DockerContainerFields
    }
  }
}

# Every field Tower maps into `Container`. Shared with `UpdateContainer`
# (DockerMutations.graphql), whose response is the recreated container with a
# new ID, so both map through one initializer.
fragment DockerContainerFields on DockerContainer {
  id
  names
  image
  state
  status
  autoStart
  isUpdateAvailable
  isOrphaned
  webUiUrl
  iconUrl
  projectUrl
  supportUrl
  registryUrl
  templatePath
  hostConfig { networkMode }
  ports { ip privatePort publicPort type }
}
